<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack - Expense Tracker</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">💳 FinTrack</div>
        <span class="header-subtitle">Personal Expense Dashboard</span>
      </div>
    </header>

    <main class="container">
      <section class="stats-grid">
        <div class="card">
          <div class="card-title">Total Balance</div>
          <div class="card-amount" id="totalBalance">$0.00</div>
        </div>
        <div class="card">
          <div class="card-title">Total Income</div>
          <div class="card-amount income-text" id="totalIncome">+$0.00</div>
        </div>
        <div class="card">
          <div class="card-title">Total Expenses</div>
          <div class="card-amount expense-text" id="totalExpense">-$0.00</div>
        </div>
      </section>

      <!-- Analytics & Transaction Form -->
      <section class="dashboard-grid">
        <!-- Donut Chart -->
        <div class="card">
          <h3 class="section-title">Expense Breakdown</h3>
          <div class="chart-container">
            <canvas id="expenseChart"></canvas>
          </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="card">
          <h3 class="section-title">Add Transaction</h3>
          <form id="txForm">
            <div class="form-row">
              <div class="form-group">
                <label for="txType">Type</label>
                <select id="txType">
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
              </div>
              <div class="form-group">
                <label for="txCategory">Category</label>
                <select id="txCategory"></select>
              </div>
            </div>

            <div class="form-group">
              <label for="txTitle">Title / Description</label>
              <input
                type="text"
                id="txTitle"
                placeholder="e.g. Groceries, Rent, Salary"
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="txAmount">Amount ($)</label>
                <input
                  type="number"
                  id="txAmount"
                  placeholder="0.00"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>
              <div class="form-group">
                <label for="txDate">Date</label>
                <input type="date" id="txDate" required />
              </div>
            </div>

            <button type="submit" class="btn-primary">Add Transaction</button>
          </form>
        </div>
      </section>

      <!-- Transaction Table with Search & Filter -->
      <section class="card">
        <div class="section-header">
          <h3 class="section-title">Transaction History</h3>
          <div class="filters-wrap">
            <input
              type="text"
              id="searchInput"
              placeholder="Search title..."
              class="search-input"
            />
            <select id="filterType">
              <option value="all">All Types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <select id="filterCategory">
              <option value="all">All Categories</option>
            </select>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-right">Amount</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody id="txTableBody">
              <!-- Dynamic rows injected by JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="script.js?v=999"></script>
  </body>
</html>
